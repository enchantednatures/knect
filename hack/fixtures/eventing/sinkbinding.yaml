apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-event-producer
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: order-event-producer
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: eventing-sinkbinding
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-event-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-event-producer
        app.kubernetes.io/part-of: knect
        knect.dev/scenario: eventing-sinkbinding
    spec:
      automountServiceAccountToken: false
      containers:
        - name: producer
          image: nginxinc/nginx-unprivileged:1.27.4
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  name: order-sinkbinding
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: eventing-sinkbinding
spec:
  subject:
    apiVersion: apps/v1
    kind: Deployment
    name: order-event-producer
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: mt-broker
