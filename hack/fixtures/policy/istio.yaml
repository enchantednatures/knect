apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-processor
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: policy-istio
spec:
  hosts:
    - order-processor.knect-e2e.example.com
  gateways:
    - mesh
  http:
    - name: primary
      route:
        - destination:
            host: order-processor.knect-e2e.svc.cluster.local
            port:
              number: 80
          weight: 90
        - destination:
            host: order-processor-canary.knect-e2e.svc.cluster.local
            port:
              number: 80
          weight: 10
      retries:
        attempts: 2
        perTryTimeout: 2s
      timeout: 10s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-processor
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: policy-istio
spec:
  host: order-processor.knect-e2e.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 100
  subsets:
    - name: stable
      labels:
        serving.knative.dev/revision: order-processor-00001
    - name: canary
      labels:
        serving.knative.dev/revision: order-processor-00002
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: knect-e2e-permissive
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: policy-istio
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-knect-namespace
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: policy-istio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-processor
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - knect-e2e
              - istio-system
      to:
        - operation:
            methods:
              - GET
              - POST
