apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: event-display
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: event-display
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: tap
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containers:
        - name: event-display
          image: nginxinc/nginx-unprivileged:1.27.4
          ports:
            - name: http1
              containerPort: 8080
          volumeMounts:
            - name: receiver-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: receiver-config
          configMap:
            name: event-receiver-config
---
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: tap-broker
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: tap
  annotations:
    eventing.knative.dev/broker.class: MTChannelBasedBroker
spec:
  config:
    apiVersion: v1
    kind: ConfigMap
    name: config-br-default-channel
    namespace: knative-eventing
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: tap-events
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: tap
spec:
  broker: tap-broker
  filter:
    attributes:
      type: com.knect.tap
  subscriber:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: event-display
