apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-canary
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: checkout-canary
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: actions-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-canary
        app.kubernetes.io/part-of: knect
        knect.dev/scenario: actions-canary
    spec:
      automountServiceAccountToken: false
      containers:
        - name: checkout-canary
          image: nginxinc/nginx-unprivileged:1.27.4
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: checkout-canary
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: actions-canary
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-canary
  service:
    port: 80
    targetPort: 8080
    gateways:
      - mesh
    hosts:
      - checkout-canary.knect-e2e.example.com
  analysis:
    interval: 10s
    threshold: 1
    maxWeight: 50
    stepWeight: 25
