apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: checkout
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: actions-traffic-split
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containers:
        - name: checkout
          image: nginxinc/nginx-unprivileged:1.27.4
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: KNECT_TRAFFIC_TARGET
              value: checkout
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
  traffic:
    - tag: blue
      revisionName: checkout-00001
      percent: 80
    - tag: green
      revisionName: checkout-00002
      percent: 20
