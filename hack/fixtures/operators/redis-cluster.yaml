apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: redis-cluster-e2e
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-redis
spec:
  clusterSize: 3
  clusterVersion: v7
  kubernetesConfig:
    image: redis:7.4.5-alpine
    imagePullPolicy: IfNotPresent
  storage:
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
  resources:
    requests:
      cpu: 1m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi
