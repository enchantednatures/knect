apiVersion: cluster.redpanda.com/v1alpha1
kind: Topic
metadata:
  name: knect-orders
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-redpanda
spec:
