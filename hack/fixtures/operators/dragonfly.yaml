apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-e2e
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-dragonfly
spec:
  replicas: 1
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.35.1
  resources:
    requests:
      cpu: 1m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 512Mi
  args:
    - --maxmemory=384mb
    - --cache_mode=true
