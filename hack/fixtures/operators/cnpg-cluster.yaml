apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ops
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-cnpg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    initdb:
      database: knect
      owner: knect
      secret:
        name: postgres-credentials
