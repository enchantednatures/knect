apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: knect-kafka
  namespace: knect-e2e
  labels:
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-strimzi
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: knect-kafka-pool
  namespace: knect-e2e
  labels:
    strimzi.io/cluster: knect-kafka
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-strimzi
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: knect-orders
  namespace: knect-e2e
  labels:
    strimzi.io/cluster: knect-kafka
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: operators-strimzi
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "86400000"
