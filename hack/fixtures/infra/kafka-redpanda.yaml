apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: knect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: knect
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
          imagePullPolicy: IfNotPresent
          command:
            - rpk
            - redpanda
            - start
          args:
            - --smp
            - "1"
            - --memory
            - 384M
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda.knect-e2e.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: knect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
