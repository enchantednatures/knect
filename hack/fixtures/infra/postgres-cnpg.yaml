apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: knect
type: Opaque
stringData:
  username: knect
  password: knect-e2e-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-e2e
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: knect
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  bootstrap:
    initdb:
      database: knect
      owner: knect
      secret:
        name: postgres-credentials
  monitoring:
    enablePodMonitor: false
