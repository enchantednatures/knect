apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: knect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: knect
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: knect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
