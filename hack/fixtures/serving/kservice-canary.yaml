apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: order-processor-canary
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: order-processor-canary
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: serving-canary
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containers:
        - name: order-processor-canary
          image: nginxinc/nginx-unprivileged:1.27.4
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: KNECT_ROLLOUT
              value: canary
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
  traffic:
    - latestRevision: true
      percent: 100
