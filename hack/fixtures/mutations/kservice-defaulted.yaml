apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: order-processor-defaulted
  namespace: knect-e2e
  labels:
    app.kubernetes.io/name: order-processor-defaulted
    app.kubernetes.io/part-of: knect
    knect.dev/scenario: mutations
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        client.knative.dev/user-image: nginxinc/nginx-unprivileged:1.27.4
    spec:
      containerConcurrency: 0
      timeoutSeconds: 300
      responseStartTimeoutSeconds: 300
      idleTimeoutSeconds: 300
      containers:
        - name: order-processor-defaulted
          image: nginxinc/nginx-unprivileged:1.27.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http1
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
  traffic:
    - latestRevision: true
      percent: 100
