{{- if .Values.actions.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "knectd.actionsRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knectd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "knectd.actionsRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "knectd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
