apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knectd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knectd.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  {{- if .Values.cache.persistence.enabled }}
  # A ReadWriteOnce cache claim cannot be attached by two pods at once.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "knectd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knectd.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "knectd.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: knectd
          image: {{ include "knectd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              protocol: TCP
            {{- if .Values.tap.enabled }}
            - name: tap
              containerPort: {{ .Values.tap.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: KNECT_DAEMON_HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: KNECT_DAEMON_SOCKET_PATH
              value: {{ .Values.config.socketPath | quote }}
            - name: KNECT_DAEMON_CACHE_DIR
              value: {{ .Values.config.cacheDir | quote }}
            - name: KNECT_ALLOW_REMOTE
              value: "true"
            - name: KNECT_DAEMON_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: KNECT_DAEMON_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: KNECT_CACHE_ENABLED
              value: {{ .Values.cache.enabled | quote }}
            - name: KNECT_CACHE_FLUSH_MS
              value: {{ .Values.cache.flushMs | quote }}
            - name: KNECT_TAP_ENABLED
              value: {{ .Values.tap.enabled | quote }}
            - name: KNECT_TAP_CALLBACK_BIND
              value: {{ .Values.tap.callbackBind | quote }}
            - name: KNECT_TAP_CALLBACK_HOST
              value: {{ .Values.tap.callbackHost | quote }}
            - name: KNECT_DAEMON_ALLOW_ACTIONS
              value: {{ .Values.actions.enabled | quote }}
            - name: KNECT_ACTIONS_ENABLED
              value: {{ .Values.actions.enabled | quote }}
            {{- with .Values.config.context }}
            - name: KNECT_DAEMON_CONTEXT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: {{ .Values.cache.persistence.mountPath }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        - name: cache
          {{- if .Values.cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "knectd.fullname" .) .Values.cache.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
