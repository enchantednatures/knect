# Default values for knectd.
#
# Security posture: the default installation is a read-only, least-privilege
# observer. It never reads Secrets and never writes to the cluster. Guarded
# mutation actions and the tap callback Service are opt-in.

# Override the chart name or full release name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/enchantednatures/knectd
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # When set, overrides tag and pulls by digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# Override the daemon command arguments, for example ["--fixture"].
args: []

serviceAccount:
  create: true
  # Defaults to the full release name when empty.
  name: ""
  automountServiceAccountToken: true
  annotations: {}

rbac:
  create: true
  # Defaults to the full release name when empty.
  clusterRoleName: ""
  # Secrets are deliberately not readable by default. Only enable this when the
  # topology view is expected to include Secret references.
  readSecrets: false
  # Additional read-only rules appended to the observer ClusterRole.
  extraRules: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

config:
  logLevel: info
  logFormat: json
  httpAddr: 0.0.0.0:7420
  # Must match the port in httpAddr; used for the container and probes.
  httpPort: 7420
  socketPath: /tmp/knectd.sock
  cacheDir: /var/cache/knect
  # Empty means the in-cluster service account context.
  context: ""
  # Extra environment variables for the daemon. Values are passed through as
  # strings and rendered next to the chart-managed variables.
  extraEnv: []

# Writable emptyDir mounted at /tmp for the Unix socket. Required because the
# container root filesystem is read-only.
tmp:
  sizeLimit: 64Mi

cache:
  enabled: true
  flushMs: 500
  persistence:
    enabled: false
    # Use an existing claim instead of creating one.
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
    annotations: {}
    mountPath: /var/cache/knect

tap:
  enabled: true
  port: 7421
  callbackBind: 0.0.0.0:7421
  # Advertised host for tap callbacks. Empty means auto-detect.
  callbackHost: ""
  service:
    enabled: false
    type: ClusterIP
    annotations: {}

actions:
  # Guarded write actions (traffic split, Flagger control, dry-run validation,
  # tap Triggers). Disabled by default. The Role is namespace-scoped to the
  # release namespace; extend extraRules for actions in other namespaces.
  enabled: false
  role:
    create: true
    # Defaults to "<fullname>-actions" when create is true.
    name: ""
  # Additional write rules appended to the actions Role.
  extraRules: []

service:
  type: ClusterIP
  port: 7420
  annotations: {}
  labels: {}

probes:
  startup:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  # Only one of minAvailable/maxUnavailable may be set.
  minAvailable: null
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
deploymentAnnotations: {}
