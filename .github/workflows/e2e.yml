name: e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: /tmp/knect-e2e-kubeconfig
  KIND_VERSION: v0.31.0
  # Hosted runners do not have enough disk for a second copy of every image.
  # Let the Kind node pull from the registry; local runs can still preload.
  KNECT_PRELOAD_IMAGES: "0"

jobs:
  kind-e2e:
    name: kind-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Create cluster and install components
        run: ./hack/setup-kind-e2e.sh

      - name: Run knect-e2e
        run: cargo run -p knect-e2e --locked -- --all

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          kubectl --kubeconfig "${KUBECONFIG}" config current-context > artifacts/context.txt 2>&1 || true
          kubectl --kubeconfig "${KUBECONFIG}" get nodes -o wide > artifacts/nodes.txt 2>&1 || true
          kubectl --kubeconfig "${KUBECONFIG}" get pods -A -o wide > artifacts/pods.txt 2>&1 || true
          kubectl --kubeconfig "${KUBECONFIG}" get events -A --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          kubectl --kubeconfig "${KUBECONFIG}" get all -A > artifacts/all.txt 2>&1 || true
          docker stats --no-stream > artifacts/docker-stats.txt 2>&1 || true
          kind export logs artifacts/kind-logs --name knect-e2e > artifacts/kind-export.txt 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knect-e2e-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Teardown
        if: always()
        run: ./hack/teardown-kind-e2e.sh
