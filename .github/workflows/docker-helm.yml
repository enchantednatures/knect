name: docker-helm

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-helm-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: knectd:ci
  KIND_CLUSTER: knect-ci
  KIND_VERSION: v0.31.0
  HELM_VERSION: v4.3.0
  NAMESPACE: knect-system

jobs:
  image-and-chart:
    name: image-and-chart
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --tag "${IMAGE}" \
            .

      - name: Smoke-test the image with fixtures
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker logs knectd-image-test || true
            docker rm -f knectd-image-test || true
          }
          trap cleanup EXIT
          docker run --detach --name knectd-image-test \
            --publish 17420:7420 "${IMAGE}" --fixture
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17420/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/healthz.json
          curl -fsS http://127.0.0.1:17420/ | tee /tmp/index.html | head -c 120
          grep -q '<title>knect' /tmp/index.html

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and render the chart
        run: |
          helm lint charts/knectd
          helm template knectd charts/knectd \
            --namespace "${NAMESPACE}" > /tmp/knectd-rendered.yaml
          test -s /tmp/knectd-rendered.yaml

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.35.0

      - name: Validate rendered manifests on the API server
        run: |
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --dry-run=server -f /tmp/knectd-rendered.yaml

      - name: Load image into Kind and install the chart
        run: |
          set -Eeuo pipefail
          kind load docker-image "${IMAGE}" --name "${KIND_CLUSTER}"
          helm upgrade --install knectd charts/knectd \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.repository=knectd \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify rollout, endpoints, and least-privilege bindings
        run: |
          kubectl -n "${NAMESPACE}" get deploy,pod,svc,sa,pdb
          kubectl -n "${NAMESPACE}" rollout status deployment/knectd --timeout=120s
          kubectl get clusterrole,clusterrolebinding | grep knectd
          kubectl -n "${NAMESPACE}" auth can-i --list \
            --as="system:serviceaccount:${NAMESPACE}:knectd"

      - name: Uninstall and delete the cluster
        if: always()
        run: |
          helm uninstall knectd --namespace "${NAMESPACE}" || true
          kubectl delete namespace "${NAMESPACE}" --wait=false || true
          kind delete cluster --name "${KIND_CLUSTER}" || true
