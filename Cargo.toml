[workspace]
members = [
    "crates/knect-proto",
    "crates/knect-core",
    "crates/knectd",
    "crates/knect-tui",
    "crates/knect-e2e",
]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/enchantednatures/knect"
homepage = "https://github.com/enchantednatures/knect"
authors = ["Hunter Casten"]

[workspace.dependencies]
# Kubernetes / runtime
kube = { version = "=4.2.0", features = ["runtime", "derive", "client", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_35"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
axum = { version = "=0.8.9", features = ["json", "http1", "tokio", "macros"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "limit", "buffer"] }
tower-http = { version = "=0.7.1", features = ["trace", "timeout", "limit", "compression-gzip"] }
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "=0.1.5"

# Serialization / schema
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = { version = "=1.2.3", features = ["derive"] }
petgraph = { version = "=0.8.3", features = ["serde-1"] }
redb = "=4.4.0"
rmp-serde = "=1.3.1"
serde_yaml = "=0.9.34"
marked-yaml = "=0.8.0"
similar = { version = "=3.2.1", features = ["text"] }

# UI / CLI
ratatui = { version = "=0.30.2", features = ["crossterm"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
mime_guess = "=2.0.5"

# Async / streams
tokio-stream = { version = "=0.1.19", features = ["time", "sync"] }
futures = "=0.3.34"
async-stream = "=0.3.6"
tokio-util = "=0.7.20"

# Observability / errors
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt", "ansi", "registry"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"

# Utilities
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
directories = "=6.0.0"
fs2 = "=0.4.3"
regex = "=1.13.1"
url = "=2.5.8"
base64 = "=0.23.1"
subtle = "=2.6.1"
hex = "=0.4.3"
toml = "=1.1.8"
unicode-width = "=0.2.3"

# Dev / test
insta = "=1.49.0"
proptest = "=1.12.0"
wiremock = "=0.6.5"
tempfile = "=3.27.0"
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
criterion = "=0.8.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
